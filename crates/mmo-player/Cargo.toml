[package]
name = "mmo-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wfo-player"
path = "src/main.rs"

[dependencies]
mmo-protocol = { path = "../mmo-protocol" }
mmo-renderer = { path = "../mmo-renderer" }
softbuffer = "0.4"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
