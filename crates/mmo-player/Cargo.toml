[package]
name = "mmo-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wfo-player"
path = "src/main.rs"

[lib]
name = "wfo_player"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
bytemuck = "1"
mmo-protocol = { path = "../mmo-protocol" }
mmo-renderer = { path = "../mmo-renderer" }
pollster = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
wgpu = "27"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
android-activity = "0.6"
